<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --paper:#FBFAF7;--ink:#1C1F1A;--mute:#5E6459;--mari:#F2A900;--line:#E4E1D8;--red:#B3261E;
  --c-paddy:#7CC242;--c-ragi:#B5651D;--c-groundnut:#D9A441;--c-sugarcane:#3E8E7E;--c-banana:#E3D35B;--c-coconut:#8C6A43;
  --c-blackgram:#4B4B6B;--c-greengram:#5FA37A;--c-sesame:#C9B79C;--c-cotton:#E8E4DA;--c-maize:#F0C419;--c-other:#9AA0A6;
  --disp:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2b2f27;color:var(--ink);font:17px/1.4 var(--body);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
#map{position:fixed;inset:0;height:100dvh;z-index:0;background:#46503f}
#map .nomap{padding:24px;color:#fff}
#dim{position:fixed;inset:0;z-index:600;background:rgba(15,20,12,.38);display:none}
body.dimmed #dim{display:block}
.fab{position:fixed;z-index:800;width:48px;height:48px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.fab svg{width:24px;height:24px}
#bk{left:12px;top:calc(12px + env(safe-area-inset-top))}
#lc{right:12px;top:calc(12px + env(safe-area-inset-top))}
body.dimmed .fab,.fab.hide{display:none}
#toast{position:fixed;z-index:850;left:50%;top:70px;transform:translateX(-50%);max-width:88%;background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;display:none;text-align:center}
#sheet{position:fixed;z-index:900;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:60dvh;overflow-y:auto;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -4px 28px rgba(0,0,0,.28);padding:22px 18px calc(18px + env(safe-area-inset-bottom));overscroll-behavior:contain}
#sheet{transition:transform .22s ease}#sheet.min{transform:translateY(calc(100% - 96px));overflow:hidden}#sheet.drag{transition:none}
#sheet::after{content:"";position:absolute;left:0;right:0;top:0;height:30px}
.stick{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--paper);padding:10px 0 calc(18px + env(safe-area-inset-bottom));margin-bottom:calc(-18px - env(safe-area-inset-bottom))}
.tick{width:64px;height:64px;border-radius:50%;background:#2E7D32;color:#fff;display:grid;place-items:center;margin:4px 0 12px}.tick svg{width:34px;height:34px}
#sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);position:absolute;left:50%;top:9px;transform:translateX(-50%)}
h1{font:600 24px/1.15 var(--disp);margin:0 0 6px;letter-spacing:-.01em}
h2{font:600 17px/1.2 var(--disp);margin:14px 0 4px}
p{margin:4px 0 10px}
.mute{color:var(--mute)}.small{font-size:15px;color:var(--mute)}
.warn{color:#8a5a00;font-weight:700}.err{color:var(--red);font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:10px 16px;margin:10px 0 0;border-radius:14px;border:1.5px solid var(--ink);background:transparent;font-weight:700}
.btn.p{background:var(--mari);border-color:var(--mari);color:var(--ink)}
.btn.txt{border-color:transparent;color:var(--mute);min-height:48px}
.btn:disabled{opacity:.4}
.two{display:flex;gap:10px}.two>*{flex:1}
.opts{margin:10px 0 0;border-top:1px solid var(--line)}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:8px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.opt:disabled{opacity:.4}
.opt .ic{flex:none;width:40px;height:40px;border-radius:10px;background:#F1EEE4;display:grid;place-items:center}
.opt .ic svg{width:24px;height:24px}
.opt b{display:block;font-size:18px}.opt span{display:block;font-size:15px;color:var(--mute);line-height:1.25}
.disp{font:600 32px/1 var(--disp);letter-spacing:2px;text-align:center;border:1.5px solid var(--line);border-radius:14px;padding:14px 8px;min-height:60px;background:#fff}
.disp.ph{font:400 18px var(--body);letter-spacing:0;color:var(--mute)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 0}
.keys button{min-height:52px;font-size:24px;font-weight:700;border-radius:12px;border:1px solid var(--line);background:#fff}
.otp{display:flex;gap:10px;justify-content:center;margin:12px 0}
.otp span{width:52px;height:60px;border:1.5px solid var(--ink);border-radius:12px;display:grid;place-items:center;font:600 28px var(--disp);background:#fff}
.units{color:var(--mute);margin:0 0 8px}
.mic{flex:none;width:64px;height:64px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center}
.mic.on{background:var(--red);box-shadow:0 0 0 8px #f2cfcb}.mic svg{width:30px;height:30px}
.mic:disabled{opacity:.4}
.microw{display:flex;align-items:center;gap:14px;margin:8px 0}
.say{font-style:italic;min-height:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px;border-radius:22px;border:1.5px solid var(--line);background:#fff;font-weight:700}
.chip.sel{border-color:var(--mari);background:#FFF4D6}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none}
.bars{display:flex;gap:6px;align-items:flex-end;margin:6px 0}
.bars div{flex:1;text-align:center;font-size:13px;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:84px}
.bars i{display:block;background:#2b6cb0;min-height:2px;border-radius:3px 3px 0 0;margin:2px 0}
.plot{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0;background:#fff}
.ph{display:flex;justify-content:space-between;align-items:baseline}
.ph b{font:600 19px var(--disp)}
.sec{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);margin-top:8px}
.sec .dot{margin-top:5px}
.adv{color:var(--mute);font-size:15px;line-height:1.3}
.sbtn{margin-top:4px;padding:6px 12px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;font-weight:700;min-height:40px}
.bigday{flex:1;text-align:center;font:600 30px/1.1 var(--disp)}
.dayrow{display:flex;align-items:center;gap:8px;margin:8px 0 2px}
.step{min-width:76px;min-height:52px;border-radius:12px;border:1.5px solid var(--ink);background:transparent;font-weight:700}
.step:disabled{opacity:.35}
.dayn{text-align:center;color:var(--mute);margin-bottom:4px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}.mgrid .chip{justify-content:center;padding:6px 4px}
.tin{width:100%;min-height:52px;font:inherit;font-size:19px;padding:10px 14px;border:1.5px solid var(--ink);border-radius:12px;background:#fff;margin:6px 0}
#strip{display:flex;gap:4px;overflow-x:auto;padding:4px 0 8px;margin:12px -18px 0;padding-left:18px;padding-right:18px;scrollbar-width:thin}
.cell{flex:none;width:46px;text-align:center}
.cell small{display:block;height:16px;font-size:12px;color:var(--mute);text-align:left;white-space:nowrap}
.cell button{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:4px 0;min-height:54px}
.cell button span{display:block;font-size:12px;color:var(--mute)}
.cell button b{display:block;font-size:18px}
.cell.sel button{background:var(--mari);border-color:var(--mari)}.cell.sel button span{color:var(--ink)}
.eyebrow{font:700 13px/1.2 var(--body);text-transform:uppercase;letter-spacing:.08em;color:#9A6500;margin:0 0 6px}
.prog{display:flex;gap:4px;margin:0 0 10px}.prog span{flex:1;height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.prog span.d{background:var(--mari)}.prog span.c::after{content:"";position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--mari)}
.savednote{font-size:15px;font-weight:700;color:#2E7D32;margin:0 0 8px;animation:noteout 2s linear forwards}
@keyframes noteout{0%,75%{opacity:1}100%{opacity:0}}
@keyframes slr{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes sll{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes fuin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.slr{animation:slr .24s ease-out}.sll{animation:sll .24s ease-out}.fuin{animation:fuin .2s ease-out}
@media (prefers-reduced-motion:reduce){.slr,.sll,.fuin{animation:none}}
.wacard{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin:12px 0 0;background:#fff}.wacard b{display:block}
.plbl{background:transparent;border:0;box-shadow:none;color:#fff;font:600 14px var(--disp);text-shadow:0 0 3px #000,0 0 3px #000}
.plbl::before{display:none}
.hdl{background:var(--mari,#F2A900);border:4px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.hdl::after{content:"";position:absolute;inset:-12px;border-radius:50%}
@media (min-width:600px){
  html,body{background:#1a1d17}
  body{display:grid;place-items:center;min-height:100dvh}
  #app{position:relative;width:412px;height:min(calc(100dvh - 32px),880px);transform:translateZ(0);overflow:hidden;border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  #map{height:100%}
  #sheet{max-height:60%}
}
</style></head>

var CROPS={paddy:["paddy","rice","nel","dhan"],ragi:["ragi","finger millet","kezhvaragu"],groundnut:["groundnut","peanut","verkadalai","moongphali"],sugarcane:["sugarcane","karumbu","ganna"],banana:["banana","vazhai","kela"],coconut:["coconut"],"black gram":["black gram","urad","ulundu"],"green gram":["green gram","moong","pasi payaru"],sesame:["sesame","ellu","til"],cotton:["cotton","paruthi"],maize:["maize","corn","makka cholam"],

/* ---------- pure helpers ---------- */
function ll(p){return Array.isArray(p)?{lat:p[0],lng:p[1]}:{lat:p.lat,lng:p.lng};}

function parseSowingDate(text,now){ // -> Date (local midnight) or null
  var base=midnight(now||new Date()),t=String(text||"").toLowerCase();
  var m=t.match(/\b(\d+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|an?)\s*(day|week|month)s?\s*(ago|back|before)/);
  if(m){var n=/\d/.test(m[1])?parseInt(m[1],10):NUMW[m[1]],u=m[2];return addDays(base,-(u==="day"?n:u==="week"?n*7:n*30));}
  if(/day before yesterday/.test(t))return addDays(base,-2);
  if(/yesterday/.test(t))return addDays(base,-1);
  if(/today|this morning|just now/.test(t))return base;
  if(/fortnight/.test(t))return addDays(base,-14);
  if(/last week/.test(t))return addDays(base,-7);
  if(/last month/.test(t))return addDays(base,-30);
  return null;}
function fmtDay(d){return DAYS[d.getDay()].slice(0,3)+" "+d.getDate()+" "+MON3[d.getMonth()];}
function fmtAreas(m2){var ac=m2/ACRE;return{acres:ac,cents:ac*100,guntha:ac*40,ha:m2/10000};}
function pad(n){return n<10?"0"+n:""+n;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

/* split a polygon by the infinite line A-B (half-plane clipping, local metres).
   poly,A,B are [lat,lng]. refM2 = plot area for the 2% rule (default: polygon area).
   returns [{poly,m2},{poly,m2}] (larger first) or null. */
function splitPoly(poly,A,B,refM2){
  if(!poly||poly.length<3||!A||!B)return null;
  var c=centroid(poly),k=111320*Math.cos(c.lat*Math.PI/180);
  function to(p){p=ll(p);return[(p.lng-c.lng)*k,(p.lat-c.lat)*111320];}
  function from(q){return[c.lat+q[1]/111320,c.lng+q[0]/k];}
  var a=to(A),b=to(B),xy=poly.map(to);
  if(Math.hypot(b[0]-a[0],b[1]-a[1])<0.5)return null;
  function side(p,s){return s*((b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]));}
  function clip(pts,s){var out=[];
    for(var i=0;i<pts.length;i++){var cu=pts[i],pr=pts[(i+pts.length-1)%pts.length],fc=side(cu,s),fp=side(pr,s);
      function ix(){var t=fp/(fp-fc);return[pr[0]+t*(cu[0]-pr[0]),pr[1]+t*(cu[1]-pr[1])];}
      if(fc>=0){if(fp<0)out.push(ix());out.push(cu);}else if(fp>=0)out.push(ix());}
    return out;}
  var res=[1,-1].map(function(s){var q=clip(xy,s);if(q.length<3)return null;var p=q.map(from);return{poly:p,m2:areaOfLatLngs(p)};});
  if(!res[0]||!res[1])return null;
  var ref=refM2||areaOfLatLngs(poly);
  if(res[0].m2<ref*0.02||res[1].m2<ref*0.02)return null;
  res.sort(function(x,y){return y.m2-x.m2;});return res;}
/* split a polygon by a bendable line (2+ points). Ends are stretched past the plot edge.
   Uses polygon-clipping; falls back to a straight cut first->last point if it didn't load. */
function splitByLine(poly,pts,refM2){
  if(!poly||poly.length<3||!pts||pts.length<2)return null;
  var PC=window.polygonClipping;if(!PC)return splitPoly(poly,pts[0],pts[pts.length-1],refM2);
  var c=centroid(poly),k=111320*Math.cos(c.lat*Math.PI/180);
  function to(p){p=ll(p);return[(p.lng-c.lng)*k,(p.lat-c.lat)*111320];}
  function from(q){return[c.lat+q[1]/111320,c.lng+q[0]/k];}
  function ar(r){var s=0;for(var i=0;i<r.length;i++){var a=r[i],b=r[(i+1)%r.length];s+=a[0]*b[1]-b[0]*a[1];}return Math.abs(s)/2;}
  var xy=poly.map(to),e=pts.map(to),ext=Math.sqrt(ar(xy))*4+50;
  function push(p,q){var d=Math.hypot(p[0]-q[0],p[1]-q[1])||1;return[p[0]+(p[0]-q[0])/d*ext,p[1]+(p[1]-q[1])/d*ext];}
  if(Math.hypot(e[0][0]-e[e.length-1][0],e[0][1]-e[e.length-1][1])<0.5)return null;
  e[0]=push(e[0],e[1]);e[e.length-1]=push(e[e.length-1],e[e.length-2]);
  var f=e[0],l=e[e.length-1],dx=l[0]-f[0],dy=l[1]-f[1],dd=Math.hypot(dx,dy),nx=-dy/dd*ext*2,ny=dx/dd*ext*2;
  var H=e.concat([[l[0]+nx,l[1]+ny],[f[0]+nx,f[1]+ny]]);
  function biggest(mp){var best=null,ba=0;(mp||[]).forEach(function(pg){var r=pg[0].slice(0,-1),a=ar(r);if(a>ba){ba=a;best=r;}});return best;}
  try{var A=biggest(PC.intersection([xy],[H])),B=biggest(PC.difference([xy],[H]));}catch(err){return null;}
  if(!A||!B||A.length<3||B.length<3||ar(A)+ar(B)<ar(xy)*0.98)return null;
  var res=[A,B].map(function(r){var p=r.map(from);return{poly:p,m2:areaOfLatLngs(p)};});
  var ref=refM2||areaOfLatLngs(poly);
  if(res[0].m2<ref*0.02||res[1].m2<ref*0.02)return null;
  res.sort(function(x,y){return y.m2-x.m2;});return res;}
function extendPath(poly,pts){ // copy of pts with both ends stretched beyond the polygon (for drawing)
  if(pts.length<2)return pts.slice();var n=pts.length,r=Math.sqrt(areaOfLatLngs(poly))*0.25;
  function push(p,q){var d=distM(ll(p),ll(q))||1,t=r/d;return[p[0]+(p[0]-q[0])*t,p[1]+(p[1]-q[1])*t];}
  return [push(pts[0],pts[1])].concat(pts.slice(1,-1),[push(pts[n-1],pts[n-2])]);}
function extendLine(poly,A,B){ // endpoints of line A-B stretched well beyond the polygon
  var c=centroid(poly),k=111320*Math.cos(c.lat*Math.PI/180),a=ll(A),b=ll(B);
  var ax=(a.lng-c.lng)*k,ay=(a.lat-c.lat)*111320,bx=(b.lng-c.lng)*k,by=(b.lat-c.lat)*111320,d=Math.hypot(bx-ax,by-ay)||1;
  var ext=Math.sqrt(areaOfLatLngs(poly))*3+d,ux=(bx-ax)/d,uy=(by-ay)/d;
  function back(x,y){return[c.lat+y/111320,c.lng+x/k];}
  return[back(ax-ux*ext,ay-uy*ext),back(ax+ux*ext,ay+uy*ext)];}

/* ---------- speech ---------- */
function listen(onText,onEnd,onErr){ // returns stop(); reports problems through onErr
  if(!SR){onErr("Voice is not available in this browser. Tap a choice below.");return null;}
  var r;try{r=new SR();}catch(e){onErr("Voice could not start. Tap a choice below.");return null;}
  r.lang="en-IN";r.interimResults=true;r.continuous=false;var final="";
  r.onresult=function(e){var s="";for(var i=0;i<e.results.length;i++){s+=e.results[i][0].transcript;if(e.results[i].isFinal)final=s;}onText(s,!!final);};
  r.onerror=function(e){onErr(e.error==="not-allowed"||e.error==="service-not-allowed"?"Microphone is blocked. Tap a choice below.":"Didn't catch that. Try again or tap a choice below.");};
  r.onend=function(){T.rec=null;onEnd(final);};
  try{r.start();}catch(e){onErr("Voice could not start. Tap a choice below.");return null;}
  return function(){try{r.stop();}catch(e){}};}
function toggleMic(parse,onResult){ // parse(text)->value|null ; onResult(value,text)
  if(T.rec){T.rec();return;}
  var tok=++T.tok;S.v={listening:true,text:"",msg:"",other:S.v.other,typing:S.v.typing};render();
  T.rec=listen(function(s){if(tok!==T.tok)return;S.v.text=s;var el=$("say");if(el)el.textContent=s;},
    function(final){if(tok!==T.tok)return;S.v.listening=false;T.rec=null;var res=final?parse(final):null;
      if(res!=null)onResult(res,final);else S.v.msg=final?"Didn't recognise that. Try again or tap a choice below.":"Didn't hear anything. Try again or tap a choice below.";
      S.v.text=final||"";render();},
    function(m){if(tok!==T.tok)return;S.v.msg=m;S.v.listening=false;T.rec=null;render();});
  if(!T.rec){S.v.listening=false;render();}}

  var v=S.v;return '<div class="microw"><button class="mic'+(v.listening?' on':'')+'" data-a="mic" aria-label="Speak" '+(SR?'':'disabled')+'>'+ICON.mic+'</button>'+
    '<div><div>'+(SR?(v.listening?"Listening… tap to stop":hint):"Voice isn't available here. Tap a choice below.")+'</div><div class="say" id="say">'+esc(v.text||"")+'</div></div></div>'+

  if(T.watch!==null&&navigator.geolocation){navigator.geolocation.clearWatch(T.watch);}T.watch=null;
  T.timers.forEach(function(t){clearInterval(t);clearTimeout(t);});T.timers=[];}

  render();}

function initMap(){
  var el=$("map");
  if(typeof window.L==="undefined"){el.innerHTML='<div class="nomap">Map could not load. You can still continue with the sheet below.</div>';return;}
  var m=T.map=L.map(el,{zoomControl:false}).setView([SAMPLE.lat,SAMPLE.lng],17);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Imagery © Esri"}).addTo(m);
  T.farmLG=L.layerGroup().addTo(m);T.draftLG=L.layerGroup().addTo(m);
  m.on("click",function(e){var p=[e.latlng.lat,e.latlng.lng];
    if(S.screen==="mark"&&S.loc.phase==="draw"){S.loc.points.push(p);drawDraft();render();}
    else if(S.screen==="split"&&S.split&&S.split.phase==="line"){insertPt(S.split.points,p);tryDivide();render();}});
  window.addEventListener("resize",function(){m.invalidateSize();});}
function fit(pts,maxZ){
  if(!hasMap()||!pts||!pts.length)return;
  var h=$("sheet").offsetHeight;T.map.invalidateSize();
  try{T.map.fitBounds(L.latLngBounds(pts),{maxZoom:maxZ||19,paddingTopLeft:[24,70],paddingBottomRight:[24,h+24]});}catch(e){}}
function allPts(){var a=[];S.farm.plots.forEach(function(p){a=a.concat(p.poly);});return a;}
function drawFarm(){
  if(!hasMap())return;T.farmLG.clearLayers();
  var dim=(S.screen==="mark"||S.screen==="confirm");
  S.farm.plots.forEach(function(p){
    p.sections.forEach(function(s){var col=ccol(s),hl=!dim&&S.cur&&S.cur.s===s.id&&(S.screen==="crop"||S.screen==="sow");
      L.polygon(s.poly,{color:hl?MARI:"#ffffff",weight:hl?3:1,dashArray:hl?"6 4":null,fillColor:col,fillOpacity:dim?.12:(s.crop?.55:.15),opacity:dim?.4:.9,interactive:false}).addTo(T.farmLG);});
    var o=L.polygon(p.poly,{color:MARI,weight:dim?2:3,fill:false,opacity:dim?.45:1,interactive:false}).addTo(T.farmLG);
    if(!dim)o.bindTooltip(esc(p.name),{permanent:true,direction:"center",className:"plbl"});});}
// draggable corner handles; pts is mutated in place
function handles(g,pts,onMove){pts.forEach(function(p,i){
  var mk=L.marker(p,{draggable:true,autoPan:false,icon:L.divIcon({className:"hdl",iconSize:[28,28],iconAnchor:[14,14]})}).addTo(g);
  mk.on("drag",function(){var ll=mk.getLatLng();pts[i]=[ll.lat,ll.lng];onMove();});
  mk.on("dragend",function(){render();});});}
function drawDraft(){
  if(!hasMap())return;var g=T.draftLG;g.clearLayers();
  var opt={color:MARI,weight:3,interactive:false};
  function dots(pts){pts.forEach(function(p){L.circleMarker(p,{radius:9,color:"#fff",weight:3,fillColor:MARI,fillOpacity:1,interactive:false}).addTo(g);});}
  if(S.screen==="mark"){var l=S.loc;
    if(l.phase==="draw"){var sh=null;if(l.points.length>=3)sh=L.polygon(l.points,{color:MARI,weight:3,fillOpacity:.15,dashArray:"6 6",interactive:false}).addTo(g);else if(l.points.length)sh=L.polyline(l.points,opt).addTo(g);
      handles(g,l.points,function(){if(sh)sh.setLatLngs(l.points);});}
    else if(l.phase==="walk"&&l.points&&l.points.length)L.polyline(l.points,{color:MARI,weight:4,interactive:false}).addTo(g);}
  else if(S.screen==="confirm"&&S.draft){var d=S.draft,pg=L.polygon(d.poly,{color:MARI,weight:3,fillColor:MARI,fillOpacity:.22,interactive:false}).addTo(g);
    if(canDrag(d))handles(g,d.poly,function(){d.m2=areaOfLatLngs(d.poly);d.sq=false;pg.setLatLngs(d.poly);
        var h=$("cfh");if(h)h.textContent=nextPlotName()+" · "+(d.m2/ACRE).toFixed(2)+" acres";});}
  else if(S.screen==="split"&&S.split){var sp=S.split,pl=plotById(sp.plotId);
    if(sp.phase!=="line"||!pl)return;
    var pcs=[0,1].map(function(i){return L.polygon(sp.pieces?sp.pieces[i].poly:[],{color:"#fff",weight:2,fillColor:i?"#4FC3F7":MARI,fillOpacity:.5,interactive:false}).addTo(g);});
    var ln=L.polyline(sp.points.length>=2?extendPath(pl.poly,sp.points):[],{color:"#fff",weight:3,dashArray:"8 6",interactive:false}).addTo(g);
    handles(g,sp.points,function(){tryDivide();ln.setLatLngs(sp.points.length>=2?extendPath(pl.poly,sp.points):[]);
      pcs.forEach(function(pg,i){pg.setLatLngs(sp.pieces?sp.pieces[i].poly:[]);});});}}

function loadRegions(){if(!T.regions&&window.fetch)T.regions=fetch("regions.json").then(function(r){return r.json();}).then(function(d){T.reg=d;if(S.screen==="crop")render();return d;}).catch(function(){T.regions=null;});}
function districtAt(lat,lng){var d=T.reg;if(!d)return null;var r=Math.floor((lat-d.lat0)/d.res),c=Math.floor((lng-d.lng0)/d.res);
  if(r<0||r>=d.rows.length||c<0)return null;var runs=d.rows[r].split(","),pos=0;
  for(var i=0;i<runs.length;i++){var q=runs[i].split("."),n=parseInt(q[0],36);if(c<pos+n)return q[1]?d.d[parseInt(q[1],36)]:null;pos+=n;}return null;}
// seasons in the data: kharif, autumn, winter, rabi, summer, whole year. Which are in the ground this month:
function activeSeasons(m){return m>=5&&m<=8?[0,1,5]:m===9||m===10?[0,2,3,5]:m===11||m<=1?[2,3,5]:m===2?[3,4,5]:[4,5];}
function regionCrops(){var p=curPlot();if(!p)return null;var c=centroid(p.poly),dd=districtAt(c.lat,c.lng);if(!dd||!dd[2].length)return null;
  var act=activeSeasons(today().getMonth());
  var rows=dd[2].filter(function(x){return CROPS[x[0]];}).map(function(x){var now=0,all=0;for(var i=1;i<7;i++){all+=x[i];if(act.indexOf(i-1)>=0)now+=x[i];}return{k:x[0],now:now,all:all};});
  rows.sort(function(a,b){return (b.now-a.now)||(b.all-a.all);});
  return{name:dd[0],state:dd[1],top:rows.map(function(r){return r.k;})};}

function fetchWeather(poly){

  function sample(){var days=[],now=new Date(),p=[0,0,6,0,0,2,0,0,0,12,4,0,0,1],t=[33,32,31,32,33,34,33,34,33,31,30,32,33,34];
    for(var i=0;i<14;i++)days.push({d:addDays(now,i-7),mm:p[i],t:t[i]});S.weather={status:"sample",days:days};wx();}
  if(typeof fetch!=="function")return sample();
  var done=false,ctl=typeof AbortController==="function"?new AbortController():null;
  clearTimeout(T.wxTimer);T.wxTimer=setTimeout(function(){if(!done){done=true;if(ctl)ctl.abort();sample();}},8000);
  fetch("https://api.open-meteo.com/v1/forecast?latitude="+c.lat.toFixed(4)+"&longitude="+c.lng.toFixed(4)+"&daily=precipitation_sum,temperature_2m_max&past_days=7&forecast_days=7&timezone=auto",ctl?{signal:ctl.signal}:{})
    .then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){
      if(done)return;var dd=j.daily;if(!dd||dd.time.length<14)throw 0;done=true;clearTimeout(T.wxTimer);
      S.weather={status:"ok",days:dd.time.map(function(s,i){var a=s.split("-");return{d:new Date(+a[0],+a[1]-1,+a[2]),mm:dd.precipitation_sum[i]||0,t:dd.temperature_2m_max[i]};})};wx();})
    .catch(function(){if(!done){done=true;clearTimeout(T.wxTimer);sample();}});}

  var past=w.days.slice(0,7),next=w.days.slice(7),tot=past.reduce(function(a,d){return a+d.mm;},0),last=null;

    '<h2>Next 7 days (mm per day)</h2><div class="bars">'+next.map(function(d){return '<div>'+Math.round(d.mm)+'<i style="height:'+Math.round(d.mm/mx*54)+'px"></i>'+DAYS[d.d.getDay()].slice(0,3)+'</div>';}).join("")+'</div>'+
    '<h2>Today</h2><p>Highest temperature <b>'+Math.round(next[0].t)+' °C</b></p>';}

  if(sp.phase==="pick"){h='<h1>Which plot has two crops?</h1><div class="opts">'+S.farm.plots.map(function(p){return opt("splitpick","pick",esc(p.name),(p.m2/ACRE).toFixed(2)+" acres",'data-p="'+p.id+'"');}).join("")+'</div><button class="btn txt" data-a="back">Cancel</button>';}
  else{var n=sp.points.length,ok=!!sp.pieces;
    h='<h1>Draw where the crops meet</h1><p class="mute">'+(n===0?'Tap a point on the line between the two crops.':n===1?'Tap the next point along the line.':'Tap more points to follow a bend. Drag a point to adjust.')+'</p>';
    if(ok){var big=sp.pieces[0],sm=sp.pieces[1],pl=plotById(sp.plotId),sec=pl.sections.filter(function(s){return s.id===sp.secId;})[0];
      h+='<div class="plot"><div class="ph"><b><i class="dot" style="background:'+MARI+'"></i> Larger</b><span>'+(big.m2/ACRE).toFixed(2)+' acres</span></div>'+
        '<div class="ph" style="margin-top:6px"><b><i class="dot" style="background:#4FC3F7"></i> Smaller</b><span>'+(sm.m2/ACRE).toFixed(2)+' acres</span></div></div>'+
        '<p class="small">The larger piece keeps '+(sec.crop?cap(sec.crop):'its crop setting')+'. Next you set the crop for the smaller one.</p>';}
    else if(n>=2)h+='<p class="warn">This line doesn\'t cut the plot cleanly into two pieces. Make sure it runs from one edge to the other without folding back.</p>';
    h+='<button class="btn p" data-a="splitok" '+(ok?'':'disabled')+'>Split here</button><div class="two"><button class="btn" data-a="splitredo" '+(n?'':'disabled')+'>Start again</button><button class="btn txt" data-a="back">Cancel</button></div>';}
  return h;}
function startSplit(plotId){var p=plotById(plotId);S.split={phase:"line",plotId:plotId,points:[],pieces:null,secId:null,msg:""};render();fit(p.poly);}
// add a tap where it bends the line least (so a tap between two points becomes a bend, not a fold-back)
function insertPt(pts,p){if(pts.length<2){pts.push(p);return;}
  function d(a,b){return distM({lat:a[0],lng:a[1]},{lat:b[0],lng:b[1]});}
  var bi=pts.length,bc=d(pts[pts.length-1],p);if(d(pts[0],p)<bc){bi=0;bc=d(pts[0],p);}
  for(var i=1;i<pts.length;i++){var c=d(pts[i-1],p)+d(p,pts[i])-d(pts[i-1],pts[i]);if(c<bc){bc=c;bi=i;}}
  pts.splice(bi,0,p);}
function tryDivide(){var sp=S.split,p=plotById(sp.plotId),best=null;sp.pieces=null;sp.secId=null;
  if(sp.points.length<2)return;
  p.sections.forEach(function(s){var r=splitByLine(s.poly,sp.points,p.m2);if(r&&(!best||s.m2>best.s.m2))best={s:s,r:r};});
  if(best){sp.pieces=best.r;sp.secId=best.s.id;}}

/* ---------- render ---------- */
var VIEWS={water:vWater,soil:vSoil,inputs:vInputs,prob:vProb,start:vStart,phone:vPhone,mark:vMark,confirm:vConfirm,done:vDone,crop:vCrop,sow:vSow,home:vHome,askcrops:vAskCrops,askplot:vAskPlot,split:vSplit};
var lastScreen=null;
function render(){
  var sh=$("sheet"),st=$("strip"),prevStrip=st?st.scrollLeft:null,prevTop=lastScreen===S.screen?sh.scrollTop:0,lastScreenChanged=lastScreen!==S.screen,prevFu=[];
  if(!lastScreenChanged)Array.prototype.forEach.call(sh.querySelectorAll("[data-fu]"),function(e){prevFu.push(e.getAttribute("data-fu"));});
  sh.innerHTML='<div id="sv"'+(lastScreenChanged?' class="'+(T.dir<0?'sll':'slr')+'"':'')+'>'+VIEWS[S.screen]()+'</div>';sh.scrollTop=prevTop;lastScreen=S.screen;T.dir=0;
  if(!lastScreenChanged)Array.prototype.forEach.call(sh.querySelectorAll("[data-fu]"),function(e){if(prevFu.indexOf(e.getAttribute("data-fu"))<0){e.classList.add("fuin");if(e.scrollIntoView)e.scrollIntoView({block:"nearest",behavior:"smooth"});}});
  document.body.classList.toggle("dimmed",S.screen==="start"||S.screen==="phone");
  $("bk").classList.toggle("hide",S.screen==="start"||S.screen==="phone"||S.screen==="done");
  $("lc").classList.toggle("hide",!navigator.geolocation||!hasMap());
  if(S.screen==="done")wx();
  if(lastScreenChanged)sh.classList.remove("min");
  if(S.screen==="mark")walkStats();
  if(S.screen==="sow")mountStrip(prevStrip);
  drawFarm();drawDraft();
  if(S.screen==="home"&&S.farm.plots.length&&sh.dataset.fitted!=="1")fit(allPts());
  sh.dataset.fitted=S.screen==="home"?"1":"0";}

/* ---------- capture ---------- */
function geoErr(msg){S.loc={phase:"choose",error:msg};render();}
function setSquare(c,acc,si){var poly=squarePoly(c,SIZES[si]);
  S.draft={sq:true,center:c,acc:acc,si:si,poly:poly,m2:areaOfLatLngs(poly)};
  if(S.screen==="confirm")render();else go("confirm");fit(poly);}
function startWalk(demo){
  S.loc={phase:"walk",points:[],dist:0,acc:null,demo:demo,msg:""};render();
  if(demo){var i=0,off=0.0013*S.farm.plots.length;T.timers.push(setInterval(function(){if(i<DEMO.length){addFix({lat:DEMO[i][0],lng:DEMO[i][1]+off,acc:6});i++;}else finish();},250));return;}
  if(!navigator.geolocation)return geoErr("Location isn't available on this device.");
  T.watch=navigator.geolocation.watchPosition(function(p){addFix({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy});},
    function(e){stopCapture();geoErr(e.code===1?"Location is blocked for this site.":"Couldn't get your location.");},{enableHighAccuracy:true,maximumAge:0,timeout:20000});}
function addFix(f){var l=S.loc;if(S.screen!=="mark"||l.phase!=="walk")return;l.acc=f.acc;
  if(f.acc>25)return walkStats();
  var last=l.points[l.points.length-1];
  if(last){var d=distM(last,f);if(d<3)return walkStats();l.dist+=d;}
  l.points.push([f.lat,f.lng]);
  if(hasMap()){if(l.points.length===1)T.map.setView([f.lat,f.lng],18);else T.map.panTo([f.lat,f.lng]);}
  drawDraft();walkStats();}
function finish(){
  var l=S.loc;if(l.phase!=="walk")return;
  if(l.points.length<4){l.msg="Only "+l.points.length+" point(s) so far. Keep walking round the plot until you have at least 4, then tap Finish.";return render();}
  stopCapture(); // stops GPS + timers only; the map stays
  var pts=l.points,gap=distM(pts[0],pts[pts.length-1]);
  S.draft={poly:pts,m2:areaOfLatLngs(pts),acc:l.acc,walked:true,warn:gap>20?"Start and end are "+Math.round(gap)+" m apart. We joined them.":""};
  go("confirm");fit(pts);}
function enterMark(){ // auto-centre once on first plot
  S.loc={phase:"choose"};go("mark");
  if(!hasMap()||S.farm.plots.length||S.centered)return;S.centered=true;
  T.map.setView([SAMPLE.lat,SAMPLE.lng],18);
  if(navigator.geolocation)navigator.geolocation.getCurrentPosition(function(p){if(S.screen==="mark"&&S.loc.phase==="choose")T.map.setView([p.coords.latitude,p.coords.longitude],18);},function(){},{enableHighAccuracy:true,timeout:8000,maximumAge:60000});}

/* ---------- events ---------- */
function setSow(d){var i=Math.max(0,Math.min(MAXSOW,daysBetween(d,today())));S.sowSel=addDays(today(),-i);}
function toSow(){var s=curSec(),t=s&&s.timing;
  S.sowSel=addDays(today(),-21);S.sowTouched=false;S.method="tp";S.monSel=null;S.regrow=false;S.ageSel=null;
  if(t&&t.kind==="day"){S.sowSel=t.date;S.sowTouched=true;S.method=t.method||"tp";}
  if(t&&t.kind==="month"){S.monSel=monthsAgo(t.date);S.regrow=!!t.regrow;}
  if(t&&t.kind==="age")S.ageSel=t.age;
  go("sow");}
function saveTiming(t){var s=curSec();s.timing=t;note(t.kind==="day"?"Day "+Math.max(0,daysBetween(t.date,today())):timingLabel(s));if(s.problem){afterSection();return;}S.inp={what:[],when:null};go("inputs");}
function finishSetup(){if(!S.tEnd){if(!S.farm.soil){go("soil");return;}S.tEnd=Date.now();go("done");}else go("home");}
function setCrop(c){var s=curSec();if(c&&c.custom){s.crop=c.custom;s.custom=true;}else{s.crop=c;s.custom=false;}s.timing=null;note(cropName(s));toSow();}
var A={
  back:function(){var s=S.screen,p;T.dir=-1;
    if(s==="water"){p=curPlot();if(p&&!p.sections[0].crop){S.farm.plots.splice(S.farm.plots.indexOf(p),1);S.cur=null;}go("confirm");}
    else if(s==="soil")go(S.variant==="aao"?"askplot":"prob");
    else if(s==="crop"&&!S.edit&&curPlot()&&curPlot().sections.indexOf(curSec())===0)go("water");
    else if(s==="phone"){S.otp=null;go("start");}
    else if(s==="mark"){if(S.loc.phase!=="choose"){stopCapture();S.loc={phase:"choose"};render();}else go(S.farm.plots.length?(S.setup?"askplot":"home"):"phone");}
    else if(s==="confirm")go("mark");
    else if(s==="sow")go("crop");
    else if(s==="inputs")toSow();
    else if(s==="prob"){S.inp=curSec().inputs&&!curSec().inputs.none?{what:curSec().inputs.what.slice(),when:curSec().inputs.when}:{what:[],when:null};go("inputs");}
    else go(S.setup&&S.cur?"askcrops":"home");},
  ver:function(e){location.hash=e.dataset.v==="aao"?"all-at-once":"progressive";S.variant=e.dataset.v;render();},
  askcropsyes:function(){var p=curPlot();S.split={phase:"line",plotId:p.id,points:[],pieces:null,secId:null,msg:""};go("split");fit(p.poly);},
  askcropsno:function(){go("askplot");},
  askplotyes:function(){S.cur=null;enterMark();},
  askplotno:function(){S.setup=false;finishSetup();},
  seefarm:function(){go("home");},
  mode:function(e){S.mode=e.dataset.m;S.variant=variantFromHash();S.setup=S.variant==="aao";S.t0=Date.now();S.taps=0;S.keys=0;go("phone");},
  key:function(e){var k=e.dataset.k;if(k==="bs")S.phone=S.phone.slice(0,-1);else if(k==="clr")S.phone="";else if(S.phone.length<10)S.phone+=k;render();},
  send:function(){var code="";for(var i=0;i<4;i++)code+=Math.floor(Math.random()*10);S.otp={code:code,shown:false};render();
    T.timers.push(setTimeout(function(){if(S.otp&&S.screen==="phone"){S.otp.shown=true;render();}},1500));},
  next:function(){enterMark();},
  locate:function(){if(!navigator.geolocation||!hasMap())return;
    navigator.geolocation.getCurrentPosition(function(p){var c=[p.coords.latitude,p.coords.longitude];T.map.setView(c,18);
      if(T.me)T.map.removeLayer(T.me);T.me=L.circleMarker(c,{radius:8,color:"#fff",weight:3,fillColor:"#1a73e8",fillOpacity:1,interactive:false}).addTo(T.map);},
      function(e){toast(e.code===1?"Location is blocked for this site.":"Couldn't get your location.");},{enableHighAccuracy:true,timeout:12000,maximumAge:0});},
  draw:function(){S.loc={phase:"draw",points:[]};render();if(hasMap()){T.map.setZoom(Math.max(T.map.getZoom(),17));}},
  walk:function(){startWalk(false);},
  demo:function(){startWalk(true);},
  here:function(){
    if(!navigator.geolocation)return geoErr("Location isn't available on this device.");
    S.loc={phase:"choose",busy:true};render();
    navigator.geolocation.getCurrentPosition(function(p){setSquare({lat:p.coords.latitude,lng:p.coords.longitude},p.coords.accuracy,2);},
      function(e){geoErr(e.code===1?"Location is blocked for this site.":"Couldn't get your location.");},{enableHighAccuracy:true,timeout:15000,maximumAge:0});},
  sample:function(){var c=SAMPLE;if(hasMap()){var m=T.map.getCenter();if(S.farm.plots.length)c={lat:m.lat,lng:m.lng};}setSquare(c,null,2);},
  undo:function(){S.loc.points.pop();drawDraft();render();},
  drawdone:function(){var pts=S.loc.points;if(pts.length<3)return;S.draft={poly:pts,m2:areaOfLatLngs(pts)};go("confirm");fit(pts);},
  finish:finish,
  cancel:function(){stopCapture();S.loc={phase:"choose"};render();},
  size:function(e){var d=S.draft;setSquare(d.center,d.acc,Math.max(0,Math.min(SIZES.length-1,d.si+parseInt(e.dataset.d,10))));},
  redo:function(){go("mark");},
  looks:function(){var d=S.draft,first=!S.farm.plots.length,id=uid(),sid=uid();
    S.farm.plots.push({id:id,name:nextPlotName(),poly:d.poly,m2:d.m2,water:null,sections:[{id:sid,poly:d.poly,m2:d.m2,crop:null,timing:null}]});
    S.cur={p:id,s:sid};S.edit=false;
    loadRegions();if(first)fetchWeather(d.poly);go("water");fit(d.poly);},
  water:function(e){var src=e.dataset.w,p=curPlot();
    if(src==="rain"){p.water={src:"rain",method:null};note("Rain only");go("crop");}
    else{S.v.src=src;render();}},
  wmethod:function(e){var p=curPlot(),src=S.v.src||(p.water&&p.water.src);if(!src||src==="rain")return;p.water={src:src,method:e.dataset.m};note(waterLine(p));go("crop");},
  soil:function(e){S.farm.soil=e.dataset.v;finishSetup();},
  wayes:function(){S.farm.wa=true;render();},
  wano:function(){S.farm.wa=false;render();},
  mic:function(){
    if(S.screen==="crop")toggleMic(function(t){var k=parseCrop(t);if(k)return k;var n=cleanCrop(t);return n?{custom:n}:null;},function(r){S.v.result=r;});
    else if(S.screen==="sow"){var k=kindOf(curSec());if(k==="age")return;
      toggleMic(parseSowingDate,function(d){if(k==="month")S.monSel=Math.min(MAXMON,monthsAgo(d));else{setSow(d);S.sowTouched=true;}});}
    else if(S.screen==="inputs")toggleMic(parseInputs,function(r){r.what.forEach(function(k){if(S.inp.what.indexOf(k)<0)S.inp.what.push(k);});if(r.when)S.inp.when=r.when;});
    else if(S.screen==="prob")toggleMic(function(t){t=String(t||"").trim();return t||null;},function(t){var x=S.prob.text?S.prob.text+". "+t:t;S.prob={text:x,tags:probTags(x)};});},
  retry:function(){S.v={};render();},
  inp:function(e){var k=e.dataset.k,w=S.inp.what,i=w.indexOf(k);if(i>=0)w.splice(i,1);else w.push(k);render();},
  inpwhen:function(e){S.inp.when=e.dataset.w;render();},
  inpsave:function(){if(!S.inp.what.length)return;note(INPUTS.filter(function(x){return S.inp.what.indexOf(x[0])>=0;}).map(function(x){return x[1].split(" /")[0];}).join(", "));curSec().inputs={what:S.inp.what.slice(),when:S.inp.when||"ns"};S.prob={text:"",tags:[]};go("prob");},
  inpnone:function(){note("No fertiliser yet");curSec().inputs={none:true};S.prob={text:"",tags:[]};go("prob");},
  probsave:function(){curSec().problem={text:S.prob.text,tags:S.prob.tags};afterSection();},
  probnone:function(){curSec().problem={none:true};afterSection();},
  probclear:function(){S.prob={text:"",tags:[]};S.v={};render();},
  probtype:function(){S.v={typing:true};render();var i=$("probin");if(i)i.focus();},
  probtyped:function(){var i=$("probin"),t=i&&i.value.trim();if(!t){i&&i.focus();return;}S.prob={text:t,tags:probTags(t)};S.v={};render();},
  crop:function(e){setCrop(e.dataset.c);},
  cropyes:function(){setCrop(S.v.result);},
  sowcell:function(e){T.keepStrip=true;S.sowSel=addDays(today(),-parseInt(e.dataset.i,10));S.sowTouched=true;render();},
  sowd:function(e){setSow(addDays(S.sowSel,parseInt(e.dataset.d,10)));S.sowTouched=true;render();},
  sowok:function(){var s=curSec(),k=kindOf(s);
    if(k==="month"){if(S.monSel==null)return;saveTiming({kind:"month",date:monthStart(S.monSel),regrow:!!REGROW[s.crop]&&S.regrow});}
    else saveTiming({kind:"day",date:S.sowSel,method:s.crop==="paddy"?S.method:null});},
  age:function(e){S.ageSel=e.dataset.g;saveTiming({kind:"age",age:e.dataset.g});},
  sowmon:function(e){S.monSel=parseInt(e.dataset.i,10);render();},
  regrow:function(e){S.regrow=e.dataset.r==="1";render();},
  method:function(e){S.method=e.dataset.m;render();},
  cropother:function(){S.v={other:true};render();},
  cropmore:function(){S.v={more:true};render();},
  croptype:function(){S.v={other:true,typing:true};render();var i=$("cropin");if(i)i.focus();},
  croptyped:function(){var i=$("cropin"),n=i&&cleanCrop(i.value);if(!n){i&&i.focus();return;}var k=parseCrop(n);S.v={result:k||{custom:n}};render();},
  setcrop:function(e){S.edit=true;S.cur={p:+e.dataset.p,s:+e.dataset.s};go("crop");},
  setsow:function(e){S.edit=true;S.cur={p:+e.dataset.p,s:+e.dataset.s};toSow();},
  addplot:function(){S.cur=null;enterMark();},
  twocrops:function(){S.split={phase:"pick",plotId:null,points:[],pieces:null,secId:null,msg:""};
    if(S.farm.plots.length===1){go("split");startSplit(S.farm.plots[0].id);}else go("split");},
  splitpick:function(e){startSplit(+e.dataset.p);},
  splitredo:function(){var p=plotById(S.split.plotId);S.split={phase:"line",plotId:p.id,points:[],pieces:null,secId:null,msg:""};render();},
  splitok:function(){var sp=S.split;if(!sp.pieces)return;var p=plotById(sp.plotId),sec=p.sections.filter(function(s){return s.id===sp.secId;})[0],nid=uid();
    var big=sp.pieces[0],sm=sp.pieces[1];sec.poly=big.poly;sec.m2=big.m2;
    var ns={id:nid,poly:sm.poly,m2:sm.m2,crop:null,timing:null};p.sections.push(ns);S.cur={p:p.id,s:nid};S.split=null;go("crop");},
  again:function(){resetFarm();if(hasMap()){T.map.setView([SAMPLE.lat,SAMPLE.lng],17);}go("phone");}
};
function boot(){
  initMap();
  document.addEventListener("click",function(ev){S.taps++;var e=ev.target.closest&&ev.target.closest("[data-a]");if(e&&!e.disabled&&A[e.dataset.a])A[e.dataset.a](e);});
  window.addEventListener("hashchange",function(){if(S.screen==="start"){S.variant=variantFromHash();render();}});
  document.addEventListener("keydown",function(){S.keys++;});
  render();}

(function(){var sh=$("sheet"),y0=null,dy=0,drag=false;
  function inHandle(cy){var r=sh.getBoundingClientRect();return cy-r.top<34;}
  sh.addEventListener("touchstart",function(e){var t=e.touches[0];if(sh.classList.contains("min")||sh.scrollTop<=0||inHandle(t.clientY)){y0=t.clientY;dy=0;drag=false;}else y0=null;},{passive:true});
  sh.addEventListener("touchmove",function(e){if(y0==null)return;dy=e.touches[0].clientY-y0;var min=sh.classList.contains("min");
    if(!min&&dy>8){drag=true;sh.classList.add("drag");sh.style.transform="translateY("+dy+"px)";e.preventDefault();}
    else if(min&&dy<-8){drag=true;e.preventDefault();}},{passive:false});
  sh.addEventListener("touchend",function(){if(y0==null)return;sh.classList.remove("drag");sh.style.transform="";
    if(drag){if(!sh.classList.contains("min")&&dy>60)sh.classList.add("min");else if(sh.classList.contains("min")&&dy<-30)sh.classList.remove("min");T.noClick=Date.now();}
    y0=null;drag=false;});
  sh.addEventListener("click",function(e){if(T.noClick&&Date.now()-T.noClick<400){e.stopPropagation();e.preventDefault();return;}
    if(sh.classList.contains("min")){sh.classList.remove("min");e.stopPropagation();e.preventDefault();return;}
    if(inHandle(e.clientY)&&!e.target.closest("[data-a]")){sh.classList.add("min");}},true);})();
window.__proto={parseInputs:parseInputs,probTags:probTags,districtAt:districtAt,regionCrops:regionCrops,activeSeasons:activeSeasons,loadRegions:function(){loadRegions();return T.regions;},cleanCrop:cleanCrop,kindOf:kindOf,timingLabel:timingLabel,areaOfLatLngs:areaOfLatLngs,parseCrop:parseCrop,parseSowingDate:parseSowingDate,splitPoly:splitPoly,splitByLine:splitByLine};
if(document.getElementById("sheet"))boot();
})();
